backend:
  name: git-gateway
  branch: main 

media_folder: "public/images/uploads" 
public_folder: "/public/images/uploads"

site_url: https://galery-web.netlify.app
display_type: grid

collections:
  - name: "produk"
    label: "Katalog Lukisan & Barang Antik"
    folder: "content/produk"
    create: true
    slug: "{{slug}}"
    # extension dan format harus sejajar dengan folder
    extension: "json"
    format: "json"
    fields:
      - { label: "Nama Karya", name: "title", widget: "string" }
      - { label: "Tahun Pembuatan", name: "year", widget: "string", required: false }
      - { label: "Harga", name: "price", widget: "string", hint: "Contoh: Rp 50.000.000 atau Price on Request" }
      - { label: "Foto Utama", name: "image", widget: "image" }
      - { label: "Deskripsi Detail", name: "body", widget: "markdown" }
      - label: "Status Ketersediaan"
        name: "status"
        widget: "select"
        options: ["Tersedia", "Terjual"]
        default: "Tersedia" # Hapus tanda koma di akhir ini